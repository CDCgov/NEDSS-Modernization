server:
  tomcat:
    accesslog:
      enabled: true

      # Log directly to stdout for local development
      directory: /dev
      prefix: stdout
      buffered: false
      suffix:
      file-date-format:
logging:
  group:
    full-sql:
      # Logs SQL Statements generated by JPA when set to DEBUG or TRACE
      - "org.hibernate.SQL"
      # Logs SQL Parameters of statements logged by JPA when set to TRACE
      - "org.hibernate.orm.jdbc.bind"
      # Logs SQL statements only when set to DEBUG
      # Logs SQL statements AND bound parameter values when set to TRACE
      - "org.springframework.jdbc.core"
  level:
    full-sql: INFO
    org:
      elasticsearch:
        # Logs queries passed to elasticsearch
        client: INFO
      springframework:
        security: INFO
    nbs:
      classic:
        outgoing: INFO   # Logs any RestTemplate interactions with NBC Classic
    gov:
      cdc:
        nbs:
          search: INFO
          report: INFO
# OTLP Tracing config for local development; used to send traces to Jaeger.
management:
  otlp:
    tracing:
      endpoint: http://jaeger:4318/v1/traces
  tracing:
    enabed: true
    sampling:
      probability: 1.0  # 1.0 means 100% of traces are sampled

nbs:
  primary-language: English
  security:
    # doesn't play nicely with safari for local dev
    tokenCookieSecure: false
    oidc:
      enabled: false
  report:
    execution:
      host: report-execution
      port: 8001
      url: http://${nbs.report.execution.host}:${nbs.report.execution.port}
  ui:
    settings:
      defaults:
        sizing: small
    features:
      address:
        autocomplete: false
        verification: false
      pageBuilder:
        enabled: true
        page:
          library:
            enabled: true
          management:
            create:
              enabled: true
            edit:
              enabled: true
      deduplication:
        enabled: true
        merge:
          enabled: true
      system:
        management:
          enabled: true
      search:
        events:
          enabled: true
        investigations:
          enabled: true
        laboratory-reports:
          enabled: true
        view:
          enabled: true
          table:
            enabled: true
      patient:
        search:
          filters:
            enabled: true
        file:
          enabled: true
          merge-history:
            enabled: false
      report:
        execution:
          enabled: true
