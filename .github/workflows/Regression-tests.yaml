name: Regression tests
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec to run"
        required: false
        type: string
        default: "cypress/**/*.feature"

jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Install dependencies
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b
        with:
          runTests: false
          working-directory: testing/regression/

      - name: Lint
        working-directory: testing/regression/
        run: npm run lint

      - name: Check formatting
        working-directory: testing/regression/
        run: npm run format:check

      - name: Run containers
        working-directory: ./cdc-sandbox
        run: ./build_all.sh

      # Check graphql types are up to date (definition and usage)
      # needs to be run after containers are running
      - name: Check Graphql generated types are still correct
        working-directory: apps/modernization-ui
        run: npm ci --ignore-scripts && npm run generate && git diff --exit-code && npm run lint && npm run typecheck

      - name: Cypress run
        uses: cypress-io/github-action@09090944bd8aaa2a517cefb6e38bf1aae336b42b
        with:
          install: false
          working-directory: testing/regression/
          spec: ${{ inputs.spec }}
          browser: chrome
        env:
          CYPRESS_BASE_URL: 'http://localhost:8000/'
          CYPRESS_LOGIN_USERNAME: 'superuser'
          CYPRESS_LOGIN_PASSWORD: ''

      # Create cypress html report
      - name: Build report
        if: ${{ !cancelled() }}
        working-directory: testing/regression/
        run: npm run githubReport

      # Zip up report
      - name: Zip report
        if: ${{ !cancelled() }}
        working-directory: testing/regression/
        run: zip -r cypress-report.zip reports/cucumber-report/*

      # Upload artifact
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: cypress-report
          path: testing/regression/cypress-report.zip
